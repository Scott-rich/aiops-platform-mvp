[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "backups", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
# Algorithm constants and structured CLI orchestration are explained in method docs.
ignore = ["E501", "PLR2004", "PLR0912", "PLR0913", "PLR0915", "PLR0911"]

[tool.mypy]
python_version = "3.11"
files = ["app", "research", "scripts/research"]
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
source = ["app", "flink", "research"]
omit = ["research/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
