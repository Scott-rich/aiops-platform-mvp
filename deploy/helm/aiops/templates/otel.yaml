{{- if .Values.otel.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-read-pods
rules:
  - apiGroups: ['']
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-read-pods
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: '{{ .Release.Name }}-otel-read-pods'}
subjects: [{kind: ServiceAccount, name: '{{ .Release.Name }}-otel', namespace: '{{ .Release.Namespace }}'}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel
  annotations:
    aiops.openai.local/collector-version: '0.123.0'
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: '0.0.0.0:4317'}
          http: {endpoint: '0.0.0.0:4318'}
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/*_{{ .Release.Name }}-otel-*/*/*.log]
        include_file_path: true
        start_at: end
        operators: [{id: container-parser, type: container}]
      hostmetrics:
        root_path: /hostfs
        collection_interval: 5s
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization: {enabled: true}
          memory:
            metrics:
              system.memory.utilization: {enabled: true}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 400, spike_limit_mib: 100}
      batch: {timeout: 1s, send_batch_size: 256}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name]
          labels: [{tag_name: service.name, key: app, from: pod}]
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: connection}]
      resource/host:
        attributes:
          - {key: service.name, value: linux-node, action: upsert}
          - {key: service.instance.id, value: '${env:NODE_NAME}', action: upsert}
    connectors:
      spanmetrics:
        namespace: traces.span.metrics
        histogram:
          explicit: {buckets: [10ms, 50ms, 100ms, 300ms, 800ms, 1s, 3s, 10s]}
        metrics_flush_interval: 5s
    exporters:
      kafka/traces:
        brokers: ['{{ .Release.Name }}-kafka:9092']
        topic: otel.traces
        encoding: otlp_json
        protocol_version: 2.1.0
        producer: {required_acks: -1}
      kafka/logs:
        brokers: ['{{ .Release.Name }}-kafka:9092']
        topic: otel.logs
        encoding: otlp_json
        producer: {required_acks: -1}
      kafka/metrics:
        brokers: ['{{ .Release.Name }}-kafka:9092']
        topic: otel.metrics
        encoding: otlp_json
        producer: {required_acks: -1}
      prometheus: {endpoint: '0.0.0.0:8889'}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [kafka/traces, spanmetrics]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [kafka/logs]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [kafka/metrics]
        metrics/host:
          receivers: [hostmetrics]
          processors: [memory_limiter, resource/host, batch]
          exporters: [kafka/metrics]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-otel
spec:
  selector:
    matchLabels: {app: '{{ .Release.Name }}-otel'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-otel'}
    spec:
      serviceAccountName: {{ .Release.Name }}-otel
      containers:
        - name: collector
          image: {{ .Values.otel.image | quote }}
          args: [--config=/conf/collector.yaml]
          env: [{name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          ports: [{name: otlp, containerPort: 4317}, {name: metrics, containerPort: 8889}]
          resources: {{ toYaml .Values.otel.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: logs, mountPath: /var/log/pods, readOnly: true}
            - {name: root, mountPath: /hostfs, readOnly: true}
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-otel'}}
        - {name: logs, hostPath: {path: /var/log/pods, type: Directory}}
        - {name: root, hostPath: {path: /, type: Directory}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel
spec:
  clusterIP: None
  selector: {app: '{{ .Release.Name }}-otel'}
  ports: [{name: otlp, port: 4317}, {name: otlp-http, port: 4318}, {name: metrics, port: 8889}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-bridge
spec:
  replicas: 1
  selector:
    matchLabels: {app: '{{ .Release.Name }}-otel-bridge'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-otel-bridge'}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: bridge
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args: ['exec python -m scripts.research.otel_bridge --output /tmp/bridge-$(date +%s)']
          env: [{name: KAFKA_BOOTSTRAP_SERVERS, value: '{{ .Release.Name }}-kafka:9092'}]
          resources: {{ toYaml .Values.app.workerResources | nindent 12 }}
{{- end }}
