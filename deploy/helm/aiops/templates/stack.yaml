{{- if ne (int .Values.app.replicas) 1 }}{{ fail "SQLite requires exactly one colocated API/worker pod" }}{{ end }}
{{- if ne (int .Values.kafka.replicas) 1 }}{{ fail "This research KRaft configuration supports exactly one broker" }}{{ end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-app-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.app.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: '{{ .Release.Name }}-app'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-app'}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: api
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: DATA_DIR, value: /data}
            - {name: EXECUTION_MODE, value: kafka-worker}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: '{{ .Release.Name }}-kafka:9092'}
            - {name: FLINK_REST_URL, value: 'http://{{ .Release.Name }}-jobmanager:8081'}
            - {name: API_RATE_PER_SECOND, value: {{ .Values.app.ratePerSecond | quote }}}
            - {name: API_RATE_BURST, value: {{ .Values.app.rateBurst | quote }}}
          {{- if .Values.app.authSecret }}
          envFrom: [{secretRef: {name: {{ .Values.app.authSecret | quote }}}}]
          {{- end }}
          livenessProbe: {httpGet: {path: /live, port: http}, initialDelaySeconds: 30}
          readinessProbe: {httpGet: {path: /live, port: http}, initialDelaySeconds: 5}
          resources: {{ toYaml .Values.app.apiResources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
        - name: worker
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.worker]
          env:
            - {name: DATA_DIR, value: /data}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: '{{ .Release.Name }}-kafka:9092'}
          readinessProbe:
            exec:
              command: [python, -c, "import pathlib,time; p=pathlib.Path('/data/worker-health.json'); assert p.exists() and time.time()-p.stat().st_mtime<30"]
            initialDelaySeconds: 30
          resources: {{ toYaml .Values.app.workerResources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: '{{ .Release.Name }}-app-data'}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app: '{{ .Release.Name }}-app'}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
spec:
  clusterIP: None
  selector: {app: '{{ .Release.Name }}-kafka'}
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
    - {name: external, port: 19092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
spec:
  serviceName: {{ .Release.Name }}-kafka
  replicas: 1
  selector:
    matchLabels: {app: '{{ .Release.Name }}-kafka'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-kafka'}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@{{ .Release.Name }}-kafka-0.{{ .Release.Name }}-kafka:9093'}
            - {name: KAFKA_LISTENERS, value: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092'}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'INTERNAL://{{ .Release.Name }}-kafka:9092,EXTERNAL://localhost:19092'}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'false'}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
          readinessProbe:
            exec: {command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, 'localhost:9092', --list]}
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources: {{ toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.kafka.storage }}}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-topics
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: {{ .Values.kafka.image | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              for topic in telemetry.metrics telemetry.logs telemetry.spans ops.alerts ops.deadletter otel.traces otel.logs otel.metrics otel.deadletter; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ .Release.Name }}-kafka:9092 --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
              done
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
