apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
- base.yaml
patches:
- patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: checkoutservice\n\
    spec:\n  template:\n    spec:\n      containers:\n      - name: server\n     \
    \   env:\n        - name: COLLECTOR_SERVICE_ADDR\n          value: aiops-otel.aiops.svc.cluster.local:4317\n\
    \        - name: OTEL_EXPORTER_OTLP_ENDPOINT\n          value: http://aiops-otel.aiops.svc.cluster.local:4317\n\
    \        - name: OTEL_SERVICE_NAME\n          value: checkoutservice\n       \
    \ - name: ENABLE_TRACING\n          value: '1'\n        - name: DISABLE_PROFILER\n\
    \          value: '1'\n        - name: POD_UID\n          valueFrom:\n       \
    \     fieldRef:\n              fieldPath: metadata.uid\n        - name: OTEL_RESOURCE_ATTRIBUTES\n\
    \          value: service.instance.id=$(POD_UID),k8s.pod.uid=$(POD_UID)\n"
